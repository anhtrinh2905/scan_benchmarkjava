[project]
name = "scan-benchmarkjava"
version = "0.1.0"
requires-python = ">=3.11"
dependencies = [
    "requests>=2.34.2",
    "scikit-learn>=1.9.0",
    "streamlit>=1.60.0",
]

# Pinned to public PyPI so the lockfile resolves off the corporate network: a build host
# (Railway) cannot reach an internal GitLab registry, and this shell exports UV_INDEX
# pointing at one. Declared here rather than left to the environment so the lock stays
# reproducible wherever it is built. See flow/04-adr.md decision 18.
[[tool.uv.index]]
name = "pypi"
url = "https://pypi.org/simple"
default = true
